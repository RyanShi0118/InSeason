name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Meal plan spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema pytest
      - run: python scripts/validate_meal_plan.py
      - name: Rules tests
        run: python -m pytest scripts -q

  ios:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test SeasonBiteKit
        run: swift test --package-path SeasonBiteKit
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app for the simulator
        run: |
          xcodebuild build \
            -project SeasonBite.xcodeproj \
            -scheme SeasonBite \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
