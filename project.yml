# Generate the Xcode project with `xcodegen generate` (brew install xcodegen).
name: SeasonBite
options:
  bundleIdPrefix: com.ryanshi
  deploymentTarget:
    iOS: "17.0"
packages:
  SeasonBiteKit:
    path: SeasonBiteKit
targets:
  SeasonBite:
    type: application
    platform: iOS
    sources:
      - path: SeasonBite
      - path: examples/2026-10-01_family_dinner.json
        buildPhase: resources
    dependencies:
      - package: SeasonBiteKit
        product: SeasonBiteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanshi.seasonbite
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 知时食
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
